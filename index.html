<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tennessee Campaign — Brawn &amp; Fox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0A0E1A;
    color: #E8E9EE;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    background:
      radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(99,102,241,0.06), transparent 60%),
      radial-gradient(ellipse 1000px 500px at 90% 30%, rgba(201,169,110,0.04), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 80%, rgba(63,191,176,0.03), transparent 60%),
      #0A0E1A;
    background-attachment: fixed;
  }
  /* subtle film grain */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }
  #root { position: relative; z-index: 2; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9CA3AF;
    font-weight: 600;
  }

  .shimmer-text {
    background: linear-gradient(90deg, #C9A96E 0%, #F2D89A 25%, #C9A96E 50%, #A6864F 75%, #C9A96E 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes pulse-ring {
    0% { transform: scale(0.7); opacity: 0; }
    50% { opacity: 0.5; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  /* state pill animated glows */
  @keyframes glow-pulse-tn {
    0%, 100% { box-shadow: 0 0 16px rgba(99,102,241,0.50), 0 0 4px rgba(99,102,241,0.55); }
    50%      { box-shadow: 0 0 38px rgba(99,102,241,1.00), 0 0 14px rgba(99,102,241,0.95); }
  }
  @keyframes glow-pulse-3 {
    0%, 100% { box-shadow: 0 0 12px rgba(63,191,176,0.42), 0 0 3px rgba(63,191,176,0.40); }
    50%      { box-shadow: 0 0 28px rgba(63,191,176,0.85), 0 0 10px rgba(63,191,176,0.75); }
  }
  @keyframes glow-pulse-2 {
    0%, 100% { box-shadow: 0 0 8px rgba(63,191,176,0.25); }
    50%      { box-shadow: 0 0 18px rgba(63,191,176,0.55); }
  }
  @keyframes glow-pulse-1 {
    0%, 100% { box-shadow: 0 0 4px rgba(63,191,176,0.10); }
    50%      { box-shadow: 0 0 10px rgba(63,191,176,0.28); }
  }
  .glow-tn { animation: glow-pulse-tn 3.6s ease-in-out infinite; }
  .glow-3  { animation: glow-pulse-3 4.2s ease-in-out infinite; }
  .glow-2  { animation: glow-pulse-2 4.8s ease-in-out infinite; }
  .glow-1  { animation: glow-pulse-1 5.4s ease-in-out infinite; }

  /* nav link */
  .navlink {
    position: relative;
    padding: 6px 2px;
    font-size: 12px;
    color: #9CA3AF;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 200ms;
    font-weight: 500;
  }
  .navlink:hover { color: #E8E9EE; }
  .navlink::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -2px;
    height: 1px; background: #C9A96E;
    transform: scaleX(0); transform-origin: left;
    transition: transform 260ms cubic-bezier(0.4,0.0,0.2,1);
  }
  .navlink:hover::after, .navlink.active::after { transform: scaleX(1); }
  .navlink.active { color: #C9A96E; }

  /* generic hover lift */
  .lift { transition: transform 220ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 220ms; }
  .lift:hover { transform: translateY(-3px); }

  /* stars / particles */
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.85); }
    50% { opacity: 0.85; transform: scale(1.1); }
  }
  @keyframes drift-up {
    0%   { transform: translateY(20vh) translateX(0); opacity: 0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
  }
  .particle {
    position: fixed; pointer-events: none; z-index: 0;
    width: 3px; height: 3px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.8) 0%, transparent 70%);
    animation: drift-up 28s linear infinite;
    will-change: transform, opacity;
  }
  .twinkle {
    position: fixed; pointer-events: none; z-index: 0;
    width: 2px; height: 2px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    animation: twinkle 4s ease-in-out infinite;
  }

  /* scroll progress bar */
  #scrollbar-fx {
    position: fixed; top: 0; left: 0; height: 2px; z-index: 100;
    background: linear-gradient(90deg, #6366F1, #C9A96E, #3FBFB0);
    box-shadow: 0 0 10px rgba(201,169,110,0.6);
    width: 0%;
    transition: width 60ms linear;
  }

  /* aurora streak across the page */
  @keyframes aurora {
    0%, 100% { transform: translateX(-30%) skewY(-6deg); opacity: 0.10; }
    50%      { transform: translateX(30%)  skewY(-6deg); opacity: 0.30; }
  }
  .aurora {
    position: fixed; pointer-events: none; z-index: 0;
    width: 140%; height: 200px; left: -20%;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.18), rgba(201,169,110,0.10), rgba(63,191,176,0.18), transparent);
    filter: blur(60px);
    animation: aurora 18s ease-in-out infinite;
  }

  /* slide variants for sections */
  @keyframes slide-fade-up {
    from { opacity: 0; transform: translateY(36px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slide-fade-left {
    from { opacity: 0; transform: translateX(-40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slide-fade-right {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* sheen sweep — used on hero numbers */
  @keyframes sheen {
    0%   { transform: translateX(-120%) skewX(-20deg); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateX(220%) skewX(-20deg); opacity: 0; }
  }

  /* gentle bob for hero monogram */
  @keyframes monogram-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  /* number tick-in */
  @keyframes tick-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* card shimmer sweep */
  @keyframes card-shimmer {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(220%); }
  }
  .card-shimmer-track {
    position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none;
  }
  .card-shimmer-track::before {
    content: "";
    position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.10), transparent);
    transform: translateX(-120%);
    transition: none;
  }
  .lift:hover .card-shimmer-track::before {
    animation: card-shimmer 1.2s ease;
  }

  /* eyebrow underline */
  @keyframes eyebrow-bar {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  /* always-on loops (independent of scroll) */
  @keyframes glow-breath {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(201,169,110,0.35)) drop-shadow(0 0 4px rgba(201,169,110,0.45)); }
    50%      { filter: drop-shadow(0 0 32px rgba(201,169,110,0.75)) drop-shadow(0 0 10px rgba(201,169,110,0.85)); }
  }
  @keyframes glow-breath-indigo {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(99,102,241,0.30)); }
    50%      { filter: drop-shadow(0 0 28px rgba(99,102,241,0.65)); }
  }
  @keyframes ring-spin-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes border-flow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes accent-pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
  @keyframes bar-shimmer-loop {
    0%   { transform: translateX(-150%) skewX(-20deg); }
    100% { transform: translateX(250%)  skewX(-20deg); }
  }
  @keyframes value-breath {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }

  .breath-gold   { animation: glow-breath 4.4s ease-in-out infinite; }
  .breath-indigo { animation: glow-breath-indigo 5.2s ease-in-out infinite; }
  .ring-orbit    { animation: ring-spin-slow 60s linear infinite; transform-origin: center; }
  .flowing-border {
    background: linear-gradient(90deg, rgba(201,169,110,0.05), rgba(201,169,110,0.30), rgba(201,169,110,0.05), rgba(99,102,241,0.30), rgba(201,169,110,0.05));
    background-size: 200% 100%;
    animation: border-flow 6s linear infinite;
  }
  .accent-dot { animation: accent-pulse 2.4s ease-in-out infinite; }
  .value-breath { animation: value-breath 5s ease-in-out infinite; }

  /* shimmer streak across bars */
  .bar-streak {
    position: absolute; top: 0; bottom: 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: bar-shimmer-loop 3.6s ease-in-out infinite;
    pointer-events: none;
  }

  /* smooth scroll */
  html { scroll-behavior: smooth; }
  @keyframes drift-orb {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px,-30px) scale(1.05); }
    66% { transform: translate(-30px,40px) scale(0.95); }
  }
  @keyframes float-soft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .ambient-orb {
    position: fixed; pointer-events: none; z-index: 0;
    border-radius: 50%; filter: blur(80px);
    will-change: transform;
  }

  /* selection */
  ::selection { background: rgba(201,169,110,0.30); color: #fff; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #0A0E1A; }
  ::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.20); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(201,169,110,0.35); }

  /* responsive */
  @media (max-width: 1100px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    .daily-grid, .geo-grid, .hero-grid, .grid-2, .email-test-grid {
      grid-template-columns: 1fr !important;
    }
  }
  @media (max-width: 900px) {
    .hero-monogram { display: none !important; }
  }
  @media (max-width: 1100px) {
    .header-nav { gap: 14px !important; }
    .header-meta { display: none !important; }
  }
  @media (max-width: 800px) {
    .header-nav { display: none !important; }
  }
  @media (max-width: 700px) {
    .metrics-grid, .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr !important; }
    section { padding-left: 24px !important; padding-right: 24px !important; }
    header { padding-left: 24px !important; padding-right: 24px !important; }
  }
</style>
</head>
<body>
<div id="scrollbar-fx"></div>
<div class="aurora" style="top:18%"></div>
<div class="aurora" style="top:55%; animation-delay:-9s; animation-duration:24s"></div>
<div class="ambient-orb" style="width:520px;height:520px;background:rgba(99,102,241,0.10);top:-160px;left:-120px;animation:drift-orb 22s ease-in-out infinite"></div>
<div class="ambient-orb" style="width:600px;height:600px;background:rgba(201,169,110,0.07);top:40%;right:-200px;animation:drift-orb 28s ease-in-out infinite reverse"></div>
<div class="ambient-orb" style="width:500px;height:500px;background:rgba(63,191,176,0.06);bottom:-150px;left:30%;animation:drift-orb 32s ease-in-out infinite"></div>

<script>
  // Scroll progress bar
  (function() {
    const bar = document.getElementById('scrollbar-fx');
    function update() {
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  })();
  // Generate twinkle stars + drifting particles
  (function() {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 40; i++) {
      const t = document.createElement('div');
      t.className = 'twinkle';
      t.style.left = Math.random() * 100 + 'vw';
      t.style.top = Math.random() * 100 + 'vh';
      t.style.animationDelay = (Math.random() * 4) + 's';
      t.style.animationDuration = (3 + Math.random() * 4) + 's';
      t.style.opacity = (0.2 + Math.random() * 0.5);
      frag.appendChild(t);
    }
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDelay = (-Math.random() * 28) + 's';
      p.style.animationDuration = (20 + Math.random() * 16) + 's';
      const size = 2 + Math.random() * 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      const tints = ['rgba(201,169,110,0.8)', 'rgba(99,102,241,0.7)', 'rgba(63,191,176,0.6)'];
      p.style.background = `radial-gradient(circle, ${tints[i % 3]} 0%, transparent 70%)`;
      frag.appendChild(p);
    }
    document.body.appendChild(frag);
  })();
</script>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="sections-1.jsx"></script>
<script type="text/babel" src="sections-2.jsx"></script>
<script type="text/babel" src="sections-3.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <React.Fragment>
        <Header />
        <HeroBand />
        <AtAGlance />
        <DailyPerformance />
        <HeroProduct />
        <WhatWorked />
        <WhatDidntWork />
        <TheRealStory />
        <Geography />
        <PerSKU />
        <EmailPerformance />
        <Footer />
        <Glossary />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
